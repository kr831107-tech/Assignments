<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Multimedia</title>
</head>
<body>

    <h1>HTML Multimedia Elements</h1>

    <h2>1. Image</h2>

    <img src="https://placehold.co/400x200"
         alt="Sample landscape image"
         width="400"
         height="200">

    <h2>2. Video</h2>

    <video width="400" height="250" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <h2>3. Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>4. YouTube Video</h2>

    <iframe
        width="400"
        height="250"
        src="https://www.youtube.com/embed/ysz5S6PUM-U"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

</body>
</html>
