<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select, Textarea and Buttons</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        select, textarea {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px 0 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Student Feedback Form</h1>

    <form>

        <label for="course">Select Your Course:</label>

        <select id="course" name="course">

            <option value="">--Select Course--</option>
            <option value="bca">BCA</option>
            <option value="btech">B.Tech</option>
            <option value="bba">BBA</option>
            <option value="bsc">B.Sc</option>

        </select>

        <label for="feedback">Enter Your Feedback:</label>

        <textarea
            id="feedback"
            name="feedback"
            rows="5"
            placeholder="Write your feedback here...">
        </textarea>

        <br>

        <button type="submit">
            Submit
        </button>

        <button type="reset">
            Reset
        </button>

        <button type="button"
                onclick="alert('Hello! Button Clicked')">
            Click Me
        </button>

    </form>

</body>
</html>
