<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Marks Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: lightblue;
        }

        tfoot {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Student Marks Table</h1>

    <table>

        <caption>Student Examination Result</caption>

        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>HTML</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Aman</td>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>JavaScript</td>
                <td>95</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total Marks</th>
                <th>270</th>
            </tr>
        </tfoot>

    </table>

</body>
</html>
