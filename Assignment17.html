<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Form Validation</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        form {
            width: 350px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Registration Form</h1>

    <form action="submit.php" method="POST">

        <label for="name">Full Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            required
            minlength="3"
            maxlength="30">

        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            required>

        <label for="mobile">Mobile Number:</label>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            pattern="[0-9]{10}"
            title="Enter exactly 10 digits"
            required>

        <label for="password">Password:</label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="6"
            maxlength="15"
            required>

        <label for="age">Age:</label>

        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="30"
            required>

        <button type="submit">
            Submit
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</body>
</html>
