<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nested and Responsive Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        .table-container {
            overflow-x: auto;
        }

        .nested-table {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Nested and Responsive Tables</h1>

    <div class="table-container">

        <table>

            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Subjects</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Rahul</td>

                <td>
                    <table class="nested-table">

                        <tr>
                            <th>Subject</th>
                            <th>Code</th>
                        </tr>

                        <tr>
                            <td>HTML</td>
                            <td>101</td>
                        </tr>

                        <tr>
                            <td>CSS</td>
                            <td>102</td>
                        </tr>

                    </table>
                </td>

                <td>90</td>
                <td>A</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Aman</td>

                <td>
                    <table class="nested-table">

                        <tr>
                            <th>Subject</th>
                            <th>Code</th>
                        </tr>

                        <tr>
                            <td>Java</td>
                            <td>103</td>
                        </tr>

                        <tr>
                            <td>Python</td>
                            <td>104</td>
                        </tr>

                    </table>
                </td>

                <td>85</td>
                <td>B</td>
            </tr>

        </table>

    </div>

</body>
</html>
