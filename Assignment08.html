<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images</h1>

    <h2>External Link</h2>

    <a href="https://www.google.com"
       target="_blank">
        Visit Google
    </a>

    <h2>Internal Link</h2>

    <a href="#about">Go to About Section</a>

    <h2>Email Link</h2>

    <a href="mailto:example@gmail.com">
        Send Email
    </a>

    <h2>Image with Attributes</h2>

    <img src="https://placehold.co/300x200"
         alt="Sample Image"
         width="300"
         height="200"
         title="This is a sample image">

    <h2>Image as a Hyperlink</h2>

    <a href="https://www.wikipedia.org"
       target="_blank">

        <img src="https://placehold.co/150x100"
             alt="Click to visit Wikipedia"
             width="150"
             height="100">

    </a>

    <h2 id="about">About Section</h2>

    <p>This is the internal link destination.</p>

</body>
</html>
